services:
  vllm-brain:
    image: vllm/vllm-openai:v0.7.1
    container_name: travel_vllm
    runtime: nvidia
    env_file:
      - .env                      # Create this file: echo "HF_TOKEN=hf_xxx" > .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_USE_V1=0
    volumes:
      - /ssd/mmg/models:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command: >
      --model google/gemma-2-9b-it
      --quantization fp8
      --gpu-memory-utilization 0.75
      --max-model-len 4096
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  travel-app:
    build: .
    container_name: travel_agent_logic
    depends_on:
      - vllm-brain
    environment:
      - VLLM_URL=http://vllm-brain:8000/v1
    volumes:
      - .:/app