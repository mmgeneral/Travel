[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
norecursedirs =
    legacy
    .venv
    _legacy_*
    tools/transcripts
    __pycache__
    .git
    .mypy_cache
    .pytest_cache
markers =
    asyncio: asynchronous coroutine tests (optional; asyncio_mode=auto discovers async tests)
